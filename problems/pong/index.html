<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pong</title>
<style>
  :root {
    --bg: #0a0a0a;
    --fg: #f2f2f2;
    --dim: #4a4a4a;
    --accent: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--fg);
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    text-align: center;
    background: rgba(10, 10, 10, 0.72);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    transition: opacity 0.25s ease;
    pointer-events: none;
  }
  .overlay.visible { pointer-events: auto; }
  .overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .title {
    font-size: clamp(40px, 10vw, 96px);
    font-weight: 100;
    letter-spacing: 0.5em;
    margin: 0 0 0 0.5em;
    color: var(--fg);
  }
  .subtitle {
    font-size: clamp(11px, 1.6vw, 14px);
    font-weight: 400;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--dim);
    max-width: 480px;
    line-height: 1.9;
  }
  .subtitle b { color: var(--fg); font-weight: 500; }
  .hint {
    margin-top: 10px;
    font-size: clamp(11px, 1.8vw, 13px);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--dim);
    animation: pulse 1.8s ease-in-out infinite;
  }
  .mode-row {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }
  .mode-btn {
    font-family: inherit;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-size: 12px;
    color: var(--dim);
    background: transparent;
    border: 1px solid var(--dim);
    padding: 10px 18px;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .mode-btn:hover, .mode-btn.active {
    color: var(--fg);
    border-color: var(--fg);
  }
  .gp-status {
    display: flex;
    gap: 28px;
    margin-top: 4px;
    font-size: clamp(10px, 1.4vw, 12px);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .gp-row b { color: var(--dim); font-weight: 500; }
  .gp-row span { transition: color 0.15s ease; }
  .gp-row span.active { color: var(--fg); }
  @keyframes pulse {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 1; }
  }
  .winner {
    font-size: clamp(22px, 4vw, 32px);
    font-weight: 200;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  #fps {
    position: absolute;
    bottom: 10px;
    right: 14px;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
    opacity: 0.6;
  }
  #debugPanel {
    position: absolute;
    top: 10px;
    left: 14px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    line-height: 1.6;
    color: #9fdca0;
    background: rgba(0, 0, 0, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 8px 10px;
    white-space: pre;
    pointer-events: none;
    display: none;
  }
  #debugPanel.visible { display: block; }
  #debugPanel .err { color: #ff8a8a; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="fps"></div>
  <div id="debugPanel"></div>

  <div id="startOverlay" class="overlay visible">
    <h1 class="title">PONG</h1>
    <div class="subtitle">
      <b>W / S</b> or <b>Gamepad</b> &mdash; left paddle<br>
      <b>&uarr; / &darr;</b> or <b>Gamepad</b> &mdash; right paddle (2P mode)
    </div>
    <div class="mode-row">
      <button class="mode-btn active" data-mode="ai">1 Player</button>
      <button class="mode-btn" data-mode="2p">2 Player</button>
    </div>
    <div class="gp-status">
      <div class="gp-row"><b>P1</b> <span id="gpLabelLeft">Keyboard</span></div>
      <div class="gp-row"><b>P2</b> <span id="gpLabelRight">AI</span></div>
    </div>
    <div class="hint">Press Space or Tap to Start</div>
    <div class="hint" style="animation: none; opacity: 0.5; margin-top: -8px; font-size: 10px;">Press a button on your controller to activate it &mdash; backtick (`) toggles controller debug</div>
  </div>

  <div id="pauseOverlay" class="overlay hidden">
    <h1 class="title" style="font-size: clamp(28px, 6vw, 48px); letter-spacing: 0.35em;">PAUSED</h1>
    <div class="hint">Press Space to Resume</div>
  </div>

  <div id="endOverlay" class="overlay hidden">
    <div class="winner" id="winnerText">PLAYER WINS</div>
    <div class="hint">Press Space or Tap to Play Again</div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d", { alpha: false });
  const stage = document.getElementById("stage");
  const startOverlay = document.getElementById("startOverlay");
  const pauseOverlay = document.getElementById("pauseOverlay");
  const endOverlay = document.getElementById("endOverlay");
  const winnerText = document.getElementById("winnerText");
  const fpsEl = document.getElementById("fps");

  // ---------- Config ----------
  const WIN_SCORE = 11;
  const PADDLE_SPEED = 900;       // px/sec at reference height
  const BALL_SPEED_START = 520;   // px/sec
  const BALL_SPEED_MAX = 1400;
  const BALL_SPEED_GAIN = 1.045;  // multiplier per paddle hit
  const AI_REACTION_SMOOTH = 10;  // higher = snappier AI tracking
  const AI_ERROR = 0.12;          // AI aim imprecision (fraction of paddle height)

  let W = 0, H = 0, DPR = 1;

  // ---------- State ----------
  const State = { START: 0, PLAYING: 1, PAUSED: 2, END: 3 };
  let state = State.START;
  let mode = "ai"; // "ai" | "2p"

  const paddle = (side) => ({
    side,
    x: 0, y: 0,
    w: 0, h: 0,
    vy: 0,
    score: 0,
  });

  const left = paddle("left");
  const right = paddle("right");
  const ball = { x: 0, y: 0, r: 0, vx: 0, vy: 0, speed: BALL_SPEED_START };

  const keys = Object.create(null);
  let touchLeftY = null, touchRightY = null;

  // ---------- Gamepad support (both paddles) ----------
  const GP_DEADZONE = 0.15;
  const gpLabelLeft = document.getElementById("gpLabelLeft");
  const gpLabelRight = document.getElementById("gpLabelRight");
  const debugPanel = document.getElementById("debugPanel");
  const gamepads = { left: null, right: null }; // gamepad.index assigned to each paddle
  let debugVisible = false;
  let gamepadError = null;

  function assignGamepad(index) {
    if (gamepads.left === null && gamepads.right !== index) {
      gamepads.left = index;
    } else if (gamepads.right === null && gamepads.left !== index) {
      gamepads.right = index;
    } else {
      return;
    }
    updateGamepadUI();
  }
  function unassignGamepad(index) {
    let changed = false;
    if (gamepads.left === index) { gamepads.left = null; changed = true; }
    if (gamepads.right === index) { gamepads.right = null; changed = true; }
    if (changed) updateGamepadUI();
  }
  function setGpRow(labelEl, index, fallbackText) {
    if (index !== null) {
      labelEl.textContent = "Gamepad Connected";
      labelEl.classList.add("active");
    } else {
      labelEl.textContent = fallbackText;
      labelEl.classList.remove("active");
    }
  }
  function updateGamepadUI() {
    setGpRow(gpLabelLeft, gamepads.left, "Keyboard");
    if (mode === "ai") {
      gpLabelRight.textContent = "AI";
      gpLabelRight.classList.remove("active");
    } else {
      setGpRow(gpLabelRight, gamepads.right, "Keyboard");
    }
  }
  function scanGamepads() {
    try {
      if (!navigator.getGamepads) {
        gamepadError = "navigator.getGamepads() unsupported in this browser";
        return;
      }
      const pads = navigator.getGamepads();
      if (gamepads.left !== null && !(pads[gamepads.left] && pads[gamepads.left].connected)) unassignGamepad(gamepads.left);
      if (gamepads.right !== null && !(pads[gamepads.right] && pads[gamepads.right].connected)) unassignGamepad(gamepads.right);
      for (let i = 0; i < pads.length; i++) {
        const gp = pads[i];
        if (gp && gp.connected && gamepads.left !== i && gamepads.right !== i) {
          assignGamepad(i);
        }
      }
      gamepadError = null;
    } catch (err) {
      gamepadError = "scanGamepads: " + err.message;
      console.error("[pong] gamepad scan failed", err);
    }
  }
  function gamepadAxisValue(index) {
    if (index === null) return null;
    try {
      const pads = navigator.getGamepads ? navigator.getGamepads() : [];
      const gp = pads[index];
      if (!gp || !gp.connected) return null;
      let v = gp.axes[1] || 0; // left stick vertical
      if (Math.abs(v) < GP_DEADZONE) v = 0;
      if (gp.buttons[12] && gp.buttons[12].pressed) v = -1; // dpad up
      if (gp.buttons[13] && gp.buttons[13].pressed) v = 1;  // dpad down
      return v;
    } catch (err) {
      gamepadError = "gamepadAxisValue(" + index + "): " + err.message;
      console.error("[pong] gamepad read failed", err);
      return null;
    }
  }
  function padSummary(gp) {
    if (!gp) return "(none)";
    const axes = gp.axes.map((a) => a.toFixed(2)).join(",");
    const pressed = gp.buttons
      .map((b, i) => (b.pressed ? i : null))
      .filter((i) => i !== null)
      .join(",");
    return `${gp.id.slice(0, 28)}\n    axes[${axes}] buttons[${pressed || "-"}]`;
  }
  function updateDebugPanel() {
    if (!debugVisible) return;
    let lines = [];
    if (!navigator.getGamepads) {
      lines.push("Gamepad API: NOT SUPPORTED");
    } else {
      const pads = navigator.getGamepads();
      let any = false;
      for (let i = 0; i < pads.length; i++) {
        const gp = pads[i];
        if (!gp) continue;
        any = true;
        const role = gamepads.left === i ? "LEFT" : gamepads.right === i ? "RIGHT" : "unassigned";
        lines.push(`[${i}] ${role} connected=${gp.connected}`);
        lines.push("    " + padSummary(gp));
      }
      if (!any) lines.push("No gamepads detected. Press a button on the controller.");
    }
    if (gamepadError) lines.push(`<span class="err">ERROR: ${gamepadError}</span>`);
    debugPanel.innerHTML = lines.join("\n");
  }
  window.addEventListener("gamepadconnected", (e) => assignGamepad(e.gamepad.index));
  window.addEventListener("gamepaddisconnected", (e) => unassignGamepad(e.gamepad.index));

  // hit flash
  let flash = 0;

  // ---------- Audio (procedural, no assets) ----------
  let actx = null;
  function audioCtx() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) actx = new AC();
    }
    return actx;
  }
  function beep(freq, dur, gainVal = 0.06) {
    const ac = audioCtx();
    if (!ac) return;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    gain.gain.value = gainVal;
    osc.connect(gain).connect(ac.destination);
    const now = ac.currentTime;
    gain.gain.setValueAtTime(gainVal, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.start(now);
    osc.stop(now + dur);
  }
  const sfx = {
    paddle: () => beep(220, 0.08, 0.05),
    wall: () => beep(160, 0.06, 0.035),
    score: () => beep(90, 0.35, 0.07),
  };

  // ---------- Layout ----------
  function layout() {
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    const rect = stage.getBoundingClientRect();
    W = Math.round(rect.width);
    H = Math.round(rect.height);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    const margin = Math.max(24, W * 0.03);
    const pw = Math.max(8, Math.round(W * 0.008));
    const ph = Math.max(60, Math.round(H * 0.16));

    left.w = right.w = pw;
    left.h = right.h = ph;
    left.x = margin;
    right.x = W - margin - pw;
    left.y = clamp(left.y || H / 2 - ph / 2, 0, H - ph);
    right.y = clamp(right.y || H / 2 - ph / 2, 0, H - ph);

    ball.r = Math.max(5, Math.round(W * 0.006));
  }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // ---------- Reset ----------
  function resetBall(direction) {
    ball.x = W / 2;
    ball.y = H / 2;
    ball.speed = BALL_SPEED_START;
    const angle = (Math.random() * 0.5 - 0.25) * Math.PI; // +-45deg
    const dir = direction || (Math.random() < 0.5 ? -1 : 1);
    ball.vx = Math.cos(angle) * ball.speed * dir;
    ball.vy = Math.sin(angle) * ball.speed;
  }

  function resetMatch() {
    left.score = 0;
    right.score = 0;
    left.y = H / 2 - left.h / 2;
    right.y = H / 2 - right.h / 2;
    resetBall();
  }

  // ---------- Input ----------
  window.addEventListener("keydown", (e) => {
    keys[e.code] = true;
    if (e.code === "Space") {
      e.preventDefault();
      handlePrimaryAction();
    }
    if (e.code === "KeyP" || e.code === "Escape") {
      if (state === State.PLAYING) setState(State.PAUSED);
      else if (state === State.PAUSED) setState(State.PLAYING);
    }
    if (e.code === "Backquote") {
      debugVisible = !debugVisible;
      debugPanel.classList.toggle("visible", debugVisible);
    }
    if (["ArrowUp", "ArrowDown"].includes(e.code)) e.preventDefault();
  });
  window.addEventListener("keyup", (e) => { keys[e.code] = false; });

  function touchToLocalY(t) {
    const rect = canvas.getBoundingClientRect();
    return t.clientY - rect.top;
  }
  canvas.addEventListener("touchstart", onTouch, { passive: true });
  canvas.addEventListener("touchmove", onTouch, { passive: true });
  canvas.addEventListener("touchend", () => { touchLeftY = null; touchRightY = null; }, { passive: true });
  function onTouch(e) {
    const rect = canvas.getBoundingClientRect();
    for (const t of e.touches) {
      const x = t.clientX - rect.left;
      const y = touchToLocalY(t);
      if (x < rect.width / 2) touchLeftY = y;
      else touchRightY = y;
    }
  }

  canvas.addEventListener("click", () => { handlePrimaryAction(); });

  document.querySelectorAll(".mode-btn").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      document.querySelectorAll(".mode-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      mode = btn.dataset.mode;
      updateGamepadUI();
    });
  });

  function handlePrimaryAction() {
    if (state === State.START || state === State.END) {
      resetMatch();
      setState(State.PLAYING);
    } else if (state === State.PAUSED) {
      setState(State.PLAYING);
    }
  }

  function setState(next) {
    state = next;
    startOverlay.classList.toggle("hidden", state !== State.START);
    startOverlay.classList.toggle("visible", state === State.START);
    pauseOverlay.classList.toggle("hidden", state !== State.PAUSED);
    pauseOverlay.classList.toggle("visible", state === State.PAUSED);
    endOverlay.classList.toggle("hidden", state !== State.END);
    endOverlay.classList.toggle("visible", state === State.END);
  }

  // ---------- Update ----------
  function movePaddle(p, targetVy, dt) {
    p.y += targetVy * dt;
    p.y = clamp(p.y, 0, H - p.h);
  }

  function updatePlayerLeft(dt) {
    const gpVal = gamepadAxisValue(gamepads.left);
    if (gpVal) {
      movePaddle(left, gpVal * PADDLE_SPEED, dt);
      return;
    }

    let vy = 0;
    if (keys.KeyW) vy -= PADDLE_SPEED;
    if (keys.KeyS) vy += PADDLE_SPEED;

    if (touchLeftY !== null) {
      const target = touchLeftY - left.h / 2;
      left.y = clamp(left.y + (target - left.y) * Math.min(1, dt * 18), 0, H - left.h);
      return;
    }
    movePaddle(left, vy, dt);
  }

  function updatePlayerRight2P(dt) {
    const gpVal = gamepadAxisValue(gamepads.right);
    if (gpVal) {
      movePaddle(right, gpVal * PADDLE_SPEED, dt);
      return;
    }

    let vy = 0;
    if (keys.ArrowUp) vy -= PADDLE_SPEED;
    if (keys.ArrowDown) vy += PADDLE_SPEED;

    if (touchRightY !== null) {
      const target = touchRightY - right.h / 2;
      right.y = clamp(right.y + (target - right.y) * Math.min(1, dt * 18), 0, H - right.h);
      return;
    }
    movePaddle(right, vy, dt);
  }

  function updateAI(dt) {
    const center = right.y + right.h / 2;
    const errorOffset = (Math.sin(ball.x * 0.01 + ball.y * 0.013) * AI_ERROR) * right.h;
    const target = ball.vx > 0 ? ball.y + errorOffset : H / 2;
    const diff = target - center;
    const follow = clamp(diff * AI_REACTION_SMOOTH * dt, -PADDLE_SPEED * dt, PADDLE_SPEED * dt);
    right.y = clamp(right.y + follow, 0, H - right.h);
  }

  function updateBall(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // top/bottom walls
    if (ball.y - ball.r < 0) {
      ball.y = ball.r;
      ball.vy = Math.abs(ball.vy);
      sfx.wall();
      flash = 0.15;
    } else if (ball.y + ball.r > H) {
      ball.y = H - ball.r;
      ball.vy = -Math.abs(ball.vy);
      sfx.wall();
      flash = 0.15;
    }

    // left paddle
    if (ball.vx < 0 &&
        ball.x - ball.r < left.x + left.w &&
        ball.x - ball.r > left.x - left.w &&
        ball.y > left.y - ball.r &&
        ball.y < left.y + left.h + ball.r) {
      bounceOffPaddle(left, 1);
    }

    // right paddle
    if (ball.vx > 0 &&
        ball.x + ball.r > right.x &&
        ball.x + ball.r < right.x + right.w * 2 &&
        ball.y > right.y - ball.r &&
        ball.y < right.y + right.h + ball.r) {
      bounceOffPaddle(right, -1);
    }

    // scoring
    if (ball.x < -ball.r * 4) {
      right.score++;
      sfx.score();
      onScore();
    } else if (ball.x > W + ball.r * 4) {
      left.score++;
      sfx.score();
      onScore();
    }
  }

  function bounceOffPaddle(p, dir) {
    const relative = (ball.y - (p.y + p.h / 2)) / (p.h / 2); // -1..1
    const maxAngle = Math.PI / 3.4; // ~53deg
    const angle = clamp(relative, -1, 1) * maxAngle;
    ball.speed = Math.min(BALL_SPEED_MAX, ball.speed * BALL_SPEED_GAIN);
    ball.vx = Math.cos(angle) * ball.speed * dir;
    ball.vy = Math.sin(angle) * ball.speed;
    // nudge out of paddle to avoid double-hit
    ball.x = dir > 0 ? p.x + p.w + ball.r + 1 : p.x - ball.r - 1;
    sfx.paddle();
    flash = 0.25;
  }

  function onScore() {
    if (left.score >= WIN_SCORE || right.score >= WIN_SCORE) {
      winnerText.textContent = (left.score > right.score ? "Left Player Wins" : "Right Player Wins");
      setState(State.END);
    } else {
      resetBall(left.score > right.score ? 1 : -1);
    }
  }

  // ---------- Draw ----------
  function draw() {
    ctx.fillStyle = "#0a0a0a";
    ctx.fillRect(0, 0, W, H);

    // subtle hit flash vignette
    if (flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${flash * 0.05})`;
      ctx.fillRect(0, 0, W, H);
      flash = Math.max(0, flash - 0.02);
    }

    // center dashed line
    ctx.strokeStyle = "rgba(255,255,255,0.15)";
    ctx.lineWidth = Math.max(2, W * 0.002);
    ctx.setLineDash([Math.max(6, H * 0.018), Math.max(8, H * 0.022)]);
    ctx.beginPath();
    ctx.moveTo(W / 2, 0);
    ctx.lineTo(W / 2, H);
    ctx.stroke();
    ctx.setLineDash([]);

    // scores
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.font = `100 ${Math.round(H * 0.12)}px "Helvetica Neue", Arial, sans-serif`;
    ctx.fillText(String(left.score), W * 0.25, H * 0.06);
    ctx.fillText(String(right.score), W * 0.75, H * 0.06);

    // paddles
    drawPaddle(left);
    drawPaddle(right);

    // ball (sharp square, no glow)
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(ball.x - ball.r, ball.y - ball.r, ball.r * 2, ball.r * 2);
  }

  function drawPaddle(p) {
    ctx.fillStyle = "#f2f2f2";
    ctx.fillRect(p.x, p.y, p.w, p.h);
  }

  // ---------- Main loop (delta-time, refresh-rate independent) ----------
  let lastTime = performance.now();
  let fpsSmooth = 0;
  let fpsTimer = 0;

  function frame(now) {
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    dt = Math.min(dt, 0.05); // clamp to avoid spiral on tab-switch/stalls

    scanGamepads();
    updateDebugPanel();

    if (dt > 0) {
      const instFps = 1 / dt;
      fpsSmooth += (instFps - fpsSmooth) * 0.1;
    }
    fpsTimer += dt;
    if (fpsTimer > 0.4) {
      fpsTimer = 0;
      fpsEl.textContent = Math.round(fpsSmooth) + " fps";
    }

    if (state === State.PLAYING) {
      updatePlayerLeft(dt);
      if (mode === "2p") updatePlayerRight2P(dt);
      else updateAI(dt);
      updateBall(dt);
    }

    draw();
    requestAnimationFrame(frame);
  }

  // ---------- Init ----------
  function init() {
    layout();
    left.y = H / 2 - left.h / 2;
    right.y = H / 2 - right.h / 2;
    resetBall();
    setState(State.START);
    updateGamepadUI();
    requestAnimationFrame((t) => { lastTime = t; requestAnimationFrame(frame); });
  }

  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  init();
})();
</script>
</body>
</html>
