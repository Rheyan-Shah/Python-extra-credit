<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Drive</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
      font-family: sans-serif;
    }

    a button {
      padding: 16px 32px;
      font-size: 18px;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    a button:hover {
      background-color: #3367d6;
    }
  </style>
</head>
<body>
  <a href="https://drive.google.com/drive/folders/1G0ddB_aH7Eu-r9ZkCOYak05guzDXgk9a?usp=sharing" target="_blank">
    <button>Open Google Drive Folder</button>
  </a>
</body>
</html>
